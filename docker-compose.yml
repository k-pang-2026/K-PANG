services:
  redis:
    image: redis:7
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-server:
    build: {context: ., dockerfile: docker/Dockerfile.api}
    image: mm-recsys-base
    command: uvicorn src.serving.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 4g
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - hf_cache:/root/.cache/huggingface

  dashboard:
    image: mm-recsys-base
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    env_file: .env
    ports: ["8501:8501"]
    depends_on: [api-server]
    volumes:
      - ./docs:/app/docs

  simulator:
    image: mm-recsys-base
    command: python -m src.simulator.run
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

volumes:
  hf_cache:

